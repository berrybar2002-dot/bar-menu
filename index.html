<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu | Bar</title>
  <style>
    body {
      background-color: #181818;
      color: #e6e2d8;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      margin: 0;
      padding: 24px 20px;
      line-height: 1.8;
      letter-spacing: 0.05em;
    }
    .container {
      max-width: 540px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      border-bottom: 1px solid #3a3630;
      padding-bottom: 20px;
      margin-bottom: 28px;
    }
    h1 {
      font-size: 24px;
      font-weight: normal;
      margin: 0 0 8px 0;
      color: #d4b886;
      letter-spacing: 0.15em;
    }
    .subtitle {
      font-size: 13px;
      color: #a39e93;
      margin: 0;
    }
    .notice {
      background-color: #22201d;
      border-left: 3px solid #d4b886;
      padding: 14px 16px;
      font-size: 14px;
      margin-bottom: 32px;
      color: #d6d1c7;
    }
    .category-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 36px;
    }
    .category-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #22201d;
      border: 1px solid #3a3630;
      border-radius: 4px;
      padding: 18px 20px;
      color: #d4b886;
      text-decoration: none;
      font-size: 17px;
      cursor: pointer;
    }
    .category-btn:active {
      background-color: #2e2b26;
    }
    .category-sub {
      display: block;
      font-size: 12px;
      color: #9e998e;
      margin-top: 2px;
    }
    .arrow {
      font-size: 18px;
      color: #d4b886;
    }
    section {
      margin-bottom: 34px;
    }
    h2 {
      font-size: 17px;
      font-weight: normal;
      color: #d4b886;
      border-bottom: 1px solid #2e2b26;
      padding-bottom: 6px;
      margin-bottom: 16px;
      letter-spacing: 0.08em;
    }
    .item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
      font-size: 16px;
    }
    .item-price {
      color: #d4b886;
      font-size: 15px;
      white-space: nowrap;
      margin-left: 12px;
    }
    .back-btn {
      display: block;
      text-align: center;
      background-color: #22201d;
      border: 1px solid #3a3630;
      border-radius: 4px;
      padding: 14px;
      color: #d4b886;
      text-decoration: none;
      font-size: 15px;
      margin-top: 36px;
      cursor: pointer;
    }
    footer {
      text-align: center;
      font-size: 12px;
      color: #7a756c;
      border-top: 1px solid #3a3630;
      padding-top: 20px;
      margin-top: 40px;
    }
    .loading {
      text-align: center;
      color: #a39e93;
      padding: 40px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="page-title">MENU</h1>
      <p class="subtitle" id="page-subtitle">DRINK &amp; FOOD</p>
    </header>

    <div id="app">
      <div class="loading">メニューを読み込んでいます...</div>
    </div>

    <footer>
      <p>ノーチャージで1杯からお気軽にお楽しみいただけます。</p>
    </footer>
  </div>

  <script>
    // ★ここにスプレッドシートのCSVリンクを貼り付けてください★
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRvWoWef3PBYwy61COSOaebQqt3XJEBDDgQFocO241k01N3cheCtdfj5jecGJ_hf991e2RjbUrWV_Fv/pubhtml?gid=0&single=true";

    let menuData = [];

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      return lines.slice(1).map(line => {
        const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(s => s.replace(/^"|"$/g, '').trim());
        return {
          category: (cols[0] || '').toLowerCase(),
          sub: cols[1] || '',
          name: cols[2] || '',
          price: cols[3] || '',
          show: cols[4] || '1'
        };
      }).filter(item => item.name && item.show !== '0');
    }

    function renderSubItems(items) {
      const groups = {};
      items.forEach(item => {
        const key = item.sub || 'MENU';
        if (!groups[key]) groups[key] = [];
        groups[key].push(item);
      });

      let html = '';
      for (const [subTitle, groupItems] of Object.entries(groups)) {
        html += `<section><h2>${subTitle}</h2>`;
        groupItems.forEach(item => {
          html += `
            <div class="item">
              <span>${item.name}</span>
              <span class="item-price">${item.price}</span>
            </div>`;
        });
        html += `</section>`;
      }
      return html;
    }

    function showHome() {
      document.getElementById('page-title').textContent = 'MENU';
      document.getElementById('page-subtitle').textContent = 'DRINK & FOOD';

      let html = `
        <div class="notice">
          メニューにないお酒やカクテルも、お好みに合わせてお作りいたします。どうぞお気軽にお声がけください。
        </div>
        <div class="category-list">
          <div class="category-btn" onclick="showCategory('whisky', 'WHISKY', 'ウイスキーメニュー')">
            <div>
              WHISKY / ウイスキー
              <span class="category-sub">スコッチ・ジャパニーズ・バーボンほか</span>
            </div>
            <span class="arrow">›</span>
          </div>
          <div class="category-btn" onclick="showCategory('gin', 'GIN &amp; SPIRITS', 'ジン・スピリッツメニュー')">
            <div>
              GIN &amp; SPIRITS / ジン・スピリッツ
              <span class="category-sub">ジン・ラム・テキーラ・ウォッカほか</span>
            </div>
            <span class="arrow">›</span>
          </div>
          <div class="category-btn" onclick="showCategory('cocktail', 'COCKTAIL', 'カクテルメニュー')">
            <div>
              COCKTAIL / カクテル
              <span class="category-sub">スタンダード・季節のフルーツ・ノンアルコール</span>
            </div>
            <span class="arrow">›</span>
          </div>
        </div>
      `;

      const otherAndFood = menuData.filter(d => d.category === 'other' || d.category === 'food');
      html += renderSubItems(otherAndFood);

      document.getElementById('app').innerHTML = html;
      window.scrollTo(0, 0);
    }

    function showCategory(catKey, title, subtitle) {
      document.getElementById('page-title').textContent = title;
      document.getElementById('page-subtitle').textContent = subtitle;

      const filtered = menuData.filter(d => d.category === catKey);
      let html = renderSubItems(filtered);
      html += `<div class="back-btn" onclick="showHome()">← トップメニューに戻る</div>`;

      document.getElementById('app').innerHTML = html;
      window.scrollTo(0, 0);
    }

    fetch(CSV_URL)
      .then(res => res.text())
      .then(text => {
        menuData = parseCSV(text);
        showHome();
      })
      .catch(() => {
        document.getElementById('app').innerHTML = '<div class="loading">メニューの読み込みに失敗しました。</div>';
      });
  </script>
</body>
</html>
