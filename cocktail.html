<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cocktail Menu | Bar</title>
  <style>
    body {
      background-color: #181818;
      color: #e6e2d8;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      margin: 0;
      padding: 24px 20px;
      line-height: 1.8;
      letter-spacing: 0.05em;
    }
    .container {
      max-width: 540px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      border-bottom: 1px solid #3a3630;
      padding-bottom: 20px;
      margin-bottom: 28px;
    }
    h1 {
      font-size: 22px;
      font-weight: normal;
      margin: 0 0 6px 0;
      color: #d4b886;
      letter-spacing: 0.15em;
    }
    .subtitle {
      font-size: 13px;
      color: #a39e93;
      margin: 0;
    }
    section {
      margin-bottom: 32px;
    }
    h2 {
      font-size: 17px;
      font-weight: normal;
      color: #d4b886;
      border-bottom: 1px solid #2e2b26;
      padding-bottom: 6px;
      margin-bottom: 16px;
      letter-spacing: 0.08em;
    }
    .item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
      font-size: 16px;
    }
    .item-price {
      color: #d4b886;
      font-size: 15px;
      white-space: nowrap;
      margin-left: 12px;
    }
    .item-desc {
      font-size: 13px;
      color: #9e998e;
      margin: -8px 0 14px 0;
    }
    .back-btn {
      display: block;
      text-align: center;
      background-color: #22201d;
      border: 1px solid #3a3630;
      border-radius: 4px;
      padding: 14px;
      color: #d4b886;
      text-decoration: none;
      font-size: 15px;
      margin-top: 36px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>COCKTAIL</h1>
      <p class="subtitle">カクテルメニュー</p>
    </header>

    <section>
      <h2>GIN &amp; VODKA / ジン・ウォッカベース</h2>
      <div class="item">
        <span>ジントニック</span>
        <span class="item-price">¥800</span>
      </div>
      <div class="item">
        <span>マティーニ</span>
        <span class="item-price">¥1,000</span>
      </div>
      <div class="item">
        <span>モスコミュール</span>
        <span class="item-price">¥800</span>
      </div>
    </section>

    <section>
      <h2>WHISKY &amp; RUM / ウイスキー・ラムベース</h2>
      <div class="item">
        <span>マンハッタン</span>
        <span class="item-price">¥1,000</span>
      </div>
      <div class="item">
        <span>オールドファッションド</span>
        <span class="item-price">¥1,000</span>
      </div>
      <div class="item">
        <span>ダイキリ / モヒート</span>
        <span class="item-price">¥900〜</span>
      </div>
    </section>

    <section>
      <h2>SEASONAL &amp; NON-ALCOHOL / 季節・ノンアルコール</h2>
      <div class="item">
        <span>季節のフルーツカクテル</span>
        <span class="item-price">¥1,100〜</span>
      </div>
      <div class="item">
        <span>ノンアルコールカクテル各種</span>
        <span class="item-price">¥700〜</span>
      </div>
      <p class="item-desc">甘め・さっぱりめなど、お好みの味わいでお作りいたします。</p>
    </section>

    <a href="index.html" class="back-btn">← トップメニューに戻る</a>
  </div>
</body>
</html>
