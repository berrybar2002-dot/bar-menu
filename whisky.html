<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whisky Menu | Bar</title>
  <style>
    body {
      background-color: #181818;
      color: #e6e2d8;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      margin: 0;
      padding: 24px 20px;
      line-height: 1.8;
      letter-spacing: 0.05em;
    }
    .container {
      max-width: 540px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      border-bottom: 1px solid #3a3630;
      padding-bottom: 20px;
      margin-bottom: 28px;
    }
    h1 {
      font-size: 22px;
      font-weight: normal;
      margin: 0 0 6px 0;
      color: #d4b886;
      letter-spacing: 0.15em;
    }
    .subtitle {
      font-size: 13px;
      color: #a39e93;
      margin: 0;
    }
    section {
      margin-bottom: 32px;
    }
    h2 {
      font-size: 17px;
      font-weight: normal;
      color: #d4b886;
      border-bottom: 1px solid #2e2b26;
      padding-bottom: 6px;
      margin-bottom: 16px;
      letter-spacing: 0.08em;
    }
    .item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
      font-size: 16px;
    }
    .item-price {
      color: #d4b886;
      font-size: 15px;
      white-space: nowrap;
      margin-left: 12px;
    }
    .item-desc {
      font-size: 13px;
      color: #9e998e;
      margin: -8px 0 14px 0;
    }
    .back-btn {
      display: block;
      text-align: center;
      background-color: #22201d;
      border: 1px solid #3a3630;
      border-radius: 4px;
      padding: 14px;
      color: #d4b886;
      text-decoration: none;
      font-size: 15px;
      margin-top: 36px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>WHISKY</h1>
      <p class="subtitle">ウイスキーメニュー</p>
    </header>

    <section>
      <h2>SINGLE MALT / シングルモルト</h2>
      <div class="item">
        <span>グレンフィディック 12年</span>
        <span class="item-price">¥900</span>
      </div>
      <div class="item">
        <span>マッカラン 12年</span>
        <span class="item-price">¥1,300</span>
      </div>
      <div class="item">
        <span>ラフロイグ 10年</span>
        <span class="item-price">¥1,100</span>
      </div>
    </section>

    <section>
      <h2>JAPANESE / ジャパニーズ</h2>
      <div class="item">
        <span>山崎 / 白州</span>
        <span class="item-price">¥1,200〜</span>
      </div>
      <div class="item">
        <span>知多</span>
        <span class="item-price">¥900</span>
      </div>
      <div class="item">
        <span>竹鶴</span>
        <span class="item-price">¥1,100</span>
      </div>
    </section>

    <section>
      <h2>BOURBON / バーボン</h2>
      <div class="item">
        <span>メーカーズマーク</span>
        <span class="item-price">¥800</span>
      </div>
      <div class="item">
        <span>ワイルドターキー 8年</span>
        <span class="item-price">¥900</span>
      </div>
      <p class="item-desc">ロック・水割り・ハイボール・ストレートでお楽しみいただけます。</p>
    </section>

    <a href="index.html" class="back-btn">← トップメニューに戻る</a>
  </div>
</body>
</html>
